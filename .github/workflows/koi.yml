name: Koi

on:
  schedule:
    - cron: "20 0 * * *"
  workflow_dispatch:
  push:
    paths: [.github/workflows/koi.yml]

permissions:
  contents: write

concurrency: koi

jobs:
  koi:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: yalongwastaken/git-koi@v1
        with:
          body: gold
          output-dir: koi
      - name: Put the koi in the pond
        shell: bash
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq imagemagick
          convert assets/pond.png null: \( koi/koi.gif -coalesce \) -layers Composite -layers Optimize koi/koi-pond.gif
          
          git add koi/koi.gif koi/koi-pond.gif
          if git diff --cached --quiet; then
            echo "The koi is unchanged; nothing to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit --quiet --message "koi: draw the day's koi"
          git push --quiet
